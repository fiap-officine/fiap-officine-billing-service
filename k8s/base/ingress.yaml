# Roteamento por path no Traefik: rotas do Billing Service.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: billing-service
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  rules:
    - http:
        paths:
          - { path: /api/v1/orcamentos, pathType: Prefix, backend: { service: { name: billing-service, port: { number: 8000 } } } }
          - { path: /api/v1/pagamentos, pathType: Prefix, backend: { service: { name: billing-service, port: { number: 8000 } } } }
          - { path: /billing, pathType: Prefix, backend: { service: { name: billing-service, port: { number: 8000 } } } }
