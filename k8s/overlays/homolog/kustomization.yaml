apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

configMapGenerator:
  - name: billing-service-config
    behavior: merge
    literals:
      - APP_ENV=homolog
      - DB_HOST=fiap-officine-homolog-rds.chmmasky8j6y.sa-east-1.rds.amazonaws.com
      - SQS_QUEUE_PREFIX=fiap-officine-homolog
      # Webhook público (rota sem authorizer no API Gateway)
      - MP_NOTIFICATION_URL=https://kai652jumh.execute-api.sa-east-1.amazonaws.com/api/v1/pagamentos/webhook
